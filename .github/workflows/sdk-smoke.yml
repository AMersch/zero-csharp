# After a release: installs the published packages from nuget.org on clean
# runners, as a user would, and builds a program for every target.
# Run by hand (Actions > SDK smoke test) once nuget.org lists the version.
name: SDK smoke test

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The ZeroCSharp version on nuget.org, e.g. 0.2.0'
        required: true

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, exe: '', targets: 'linux-arm64 win-x64' }
          - { runner: ubuntu-24.04-arm, exe: '', targets: 'linux-x64 win-x64' }
          - { runner: windows-latest, exe: '.exe', targets: 'linux-x64 linux-arm64' }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install the templates and make a program
        env:
          VERSION: ${{ inputs.version }}
        run: |
          dotnet new install "ZeroCSharp.Templates::$VERSION"
          dotnet new zero -o Hello
          grep -q "ZeroCSharp.Sdk/$VERSION" Hello/Hello.csproj
      - name: Build and run it
        working-directory: Hello
        env:
          EXE: ${{ matrix.exe }}
        run: |
          dotnet build
          out=$(echo Ann | "bin/Debug/$(ls bin/Debug)/Hello$EXE")
          echo "$out"
          [[ "$out" == *"Hello, Ann!"* ]]
      - name: Build for the other targets
        working-directory: Hello
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          for t in $TARGETS; do
            dotnet build -p:ZeroTarget=$t
            x=; [ "$t" = win-x64 ] && x=.exe
            ls -la "bin/Debug/$(ls bin/Debug)/$t/Hello$x"
          done
      # The storyteller: ZeroCSharp.Stories260K from nuget.org, and the story
      # the repository's Llama sample tells.
      - name: Make and run the storyteller
        env:
          EXE: ${{ matrix.exe }}
        run: |
          dotnet new zerollama -o Story
          cd Story
          dotnet build
          out=$("bin/Debug/$(ls bin/Debug)/Story$EXE" | tr -d '\r')
          echo "$out"
          [[ "$out" == "Once upon a time, there was a little girl named Lily."* ]]
