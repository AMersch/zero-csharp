<!doctype html>
<!--
  Source of docs/img/social.png, the image link previews show (Open Graph / Twitter card).
  Not published. To redraw it after a change, from the repository root:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
      --virtual-time-budget=2000 --screenshot=docs/img/social.png \
      "file://$PWD/docs/social/card.html"
  (On Linux, use google-chrome or chromium in place of the macOS path.)
  The list on the right is the landing page's "You keep / You do without", shortened.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zero C# social card</title>
<style>
  @font-face {
    font-family: 'Inter';
    font-weight: 100 900;
    src: url('../fonts/inter-latin-wght-normal.woff2') format('woff2');
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #16213a; color: #fff; font-family: Inter, sans-serif;
  }
  /* A faint chip grid: the mark's pins, repeated. */
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgb(224 165 38 / 13%) 1.5px, transparent 1.6px);
    background-size: 28px 28px;
    mask-image: linear-gradient(100deg, transparent 35%, #000 80%);
  }
  .text { position: absolute; left: 72px; top: 64px; width: 520px; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 26px; letter-spacing: -0.01em; }
  .brand img { width: 48px; height: 48px; }
  h1 { margin: 56px 0 24px; font-size: 68px; line-height: 1.0; letter-spacing: -0.035em; font-weight: 800; }
  .sub { margin: 0; font-size: 24px; line-height: 1.45; color: #c5cce0; }
  .targets { position: absolute; left: 72px; bottom: 60px; display: flex; gap: 10px; }
  .targets span {
    padding: 7px 14px; border: 1.5px solid rgb(224 165 38 / 55%); border-radius: 999px;
    font-size: 17px; font-weight: 600; color: #e0a526;
  }

  .ledger {
    position: absolute; left: 664px; top: 64px; width: 476px; margin: 0; padding: 38px 40px;
    list-style: none; border-radius: 16px; background: #0f1729;
    box-shadow: 0 0 0 1px rgb(255 255 255 / 8%), 0 30px 60px rgb(0 0 0 / 35%);
  }
  .ledger li { display: flex; align-items: center; gap: 18px; font-size: 32px; font-weight: 700; letter-spacing: -0.015em; }
  .ledger li + li { margin-top: 20px; }
  .ledger svg { width: 38px; height: 38px; flex: none; }
  .ledger .gone { color: #8e98b3; text-decoration: line-through; text-decoration-color: #ff9e8a; text-decoration-thickness: 2.5px; }
  .ledger hr { border: 0; border-top: 1px solid rgb(255 255 255 / 10%); margin: 28px 0; }
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><img src="../img/mark.svg" alt="">Zero C#</div>
    <h1>C# with nothing underneath</h1>
    <p class="sub">A bflat fork that compiles C# to small native programs, from Linux to a 386.</p>
  </div>
  <div class="targets"><span>Linux</span><span>macOS</span><span>Windows</span><span>WebAssembly</span><span>DOS</span><span>UEFI</span></div>
  <ul class="ledger">
    <li><svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="#e0a526"/><path d="M10 17.5l4.5 4.5L24 12.5" fill="none" stroke="#16213a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>C# 15</li>
    <li><svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="#e0a526"/><path d="M10 17.5l4.5 4.5L24 12.5" fill="none" stroke="#16213a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Real generics</li>
    <li><svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="#e0a526"/><path d="M10 17.5l4.5 4.5L24 12.5" fill="none" stroke="#16213a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Interfaces</li>
    <li><svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="#e0a526"/><path d="M10 17.5l4.5 4.5L24 12.5" fill="none" stroke="#16213a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Records and lambdas</li>
    <hr>
    <li><svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="none" stroke="#ff9e8a" stroke-width="2.2"/><path d="M12 12l10 10M22 12L12 22" fill="none" stroke="#ff9e8a" stroke-width="2.8" stroke-linecap="round"/></svg><span class="gone">Garbage collector</span></li>
    <li><svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="none" stroke="#ff9e8a" stroke-width="2.2"/><path d="M12 12l10 10M22 12L12 22" fill="none" stroke="#ff9e8a" stroke-width="2.8" stroke-linecap="round"/></svg><span class="gone">.NET runtime</span></li>
  </ul>
</body>
</html>
